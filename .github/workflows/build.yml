name: Build APK
on:
  push:
    branches: [ gh-pages ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli
      - name: Init Bubblewrap
        run: |
          bubblewrap init --manifest https://hj7799.github.io/photo-web/manifest.json --directory twa
      - name: Build APK
        run: |
          cd twa
          bubblewrap build
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoNaming
          path: twa/app-release-unsigned.apk
