name: Build APK
on:
  push:
    branches: [ gh-pages ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build TWA
        uses: GoogleChromeLabs/twa-devicesupport@latest
        with:
          url: "https://hj7799.github.io/photo-web/"
          name: "PhotoNaming"
          apk-destination: .

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoNaming
          path: app-release.apk
