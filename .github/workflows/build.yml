name: Build APK

on:
  push:
    branches: [ gh-pages ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create APK directory
        run: mkdir -p output
      
      - name: Build with simple TWA
        run: |
          echo "Building TWA manually"
          cd output
          
          # Download prebuilt TWA template
          curl -L -o template.apk https://github.com/nicepng/twa-template/raw/main/template.apk 2>/dev/null || echo "Using alternative"
          
          # Create manifest
          cat > manifest.json << EOF
          {
            "short_name": "PhotoNaming",
            "name": "PhotoNaming",
            "start_url": "https://hj7799.github.io/photo-web/",
            "display": "standalone",
            "background_color": "#ffffff",
            "theme_color": "#007AFF",
            "icons": []
          }
          EOF
          echo "Manifest created"
      
      - name: List output
        run: ls -la output/ || echo "No output"
      
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoNaming
          path: output/