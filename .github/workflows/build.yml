name: Build APK

on:
  push:
    branches: [ gh-pages ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      
      - name: Download Bubblewrap
        run: |
          npm install -g @aspect-dev/twa
          npx twa "https://hj7799.github.io/photo-web/" --name PhotoNaming --skipSigning
      
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoNaming
          path: app-release-unsigned.apk