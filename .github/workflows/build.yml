name: Build APK
on:
  push:
    branches: [ gh-pages ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: team_xxxxxxxx
          vercel-project-id: prj_xxxxxxxx
          vercel-args: --prod
      
      - name: Build APK from deployed URL
        run: |
          npm init -y
          npm install -g @aspect-dev/twa
          npx twa "https://photo-web-XXXXX.vercel.app/" --name PhotoNaming
      
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoNaming
          path: "*.apk"