name: Build APK
on:
  push:
    branches: [ gh-pages ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Download TWA tools
        run: |
          curl -L -o twa-tools.zip https://github.com/GoogleChromeLabs/twa-tools/releases/download/v1.0.0/twa-tools-linux.zip
          unzip -q twa-tools.zip
      - name: Build APK
        run: |
          cd twa-tools
          ./twa "https://hj7799.github.io/photo-web/" --name PhotoNaming
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoNaming
          path: "twa-tools/*.apk"