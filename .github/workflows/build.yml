name: Build APK
on:
  push:
    branches: [ gh-pages ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build with PWA Builder
        run: |
          npm install -g @pwa-builder/cli
          pwabuilder api https://hj7799.github.io/photo-web/ -p android -o android-output
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoNaming
          path: android-output/*.apk