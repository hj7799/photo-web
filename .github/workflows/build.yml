name: Build APK
on:
  push:
    branches: [ gh-pages ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pwa-builder
        run: npm install -g pwa-builder
      - name: Build APK
        run: |
          pwabuilder api https://hj7799.github.io/photo-web/ -o . -p android
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoNaming
          path: "*.apk"