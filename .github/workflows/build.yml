name: Build APK
on:
  push:
    branches: [ gh-pages ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Build with Bubblewrap
        uses: nicesick/ghaction-bubblewrap@master
        with:
          args: build "https://hj7799.github.io/photo-web/"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoNaming
          path: "*.apk"