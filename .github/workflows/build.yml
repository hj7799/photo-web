name: Build APK
on:
  push:
    branches: [ gh-pages ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install CocoaPods
        run: sudo gem install cocoapods
      - name: Build with TWA
        run: |
          npm init -y
          npm install -g @aspect-dev/twa
          npx twa "https://hj7799.github.io/photo-web/" --name PhotoNaming --skipSigning
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoNaming
          path: "*.apk"