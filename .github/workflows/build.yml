name: Build APK

on:
  push:
    branches: [ gh-pages ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: gh-pages
      
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y nodejs npm default-jdk
      
      - name: Build APK
        run: |
          npm init -y
          npm install -g pwa-builder
          pwabuilder api https://hj7799.github.io/photo-web/ -p android -o .
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoNaming
          path: "*.apk"