name: Build APK
on:
  push:
    branches: [ gh-pages ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Build with TWA
        uses: And炉/twa-builder@v1
        with:
          origin: "https://hj7799.github.io/photo-web/"
          appName: "PhotoNaming"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoNaming
          path: app*.apk
